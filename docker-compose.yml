services:
  eagle-viewer:
    image: eagle-viewer:latest
    # build: .  # build from source instead
    container_name: eagle-viewer
    restart: always
    ports:
      - "8000:8000"
    environment:
      - EAGLE_VAULT_ROOT=/vault
      - VIEWER_PASSWORD=""
      - VIEWER_SECRET_KEY=""
      - VIEWER_API_TOKEN=""
      - VIEWER_STATE_PATH=/data/eagle-viewer-state.json
    network_mode: bridge
    volumes:
      # Mount your Eagle library directory into the container at /vault.
      # Example: point to the actual path on your NAS, e.g. /volume1/eagle/Design.library
      - ./vault:/vault:ro
      - ./data:/data
