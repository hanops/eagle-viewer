[project]
name = "eagle-viewer"
version = "2.0.0"
description = "Read-only viewer for Eagle libraries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.32.0",
  "python-multipart==0.0.12",
  "itsdangerous==2.2.0",
]

[dependency-groups]
dev = [
  "httpx==0.27.2",
  "pytest==8.3.3",
  "ruff==0.7.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
