# docker-compose.remote.example.yml
# =============================================================================
# Server-side Eagle library mount + remote mobile access (LAN / VPN / HTTPS)
#
# Core design:
#   - The vault is mounted on the server only. Phones access it via HTTP.
#   - Never mount .library directly on a mobile device.
#   - Recommended remote access: VPN (Tailscale / ZeroTier / WireGuard) + HTTPS.
#
# Usage:
#   docker compose -f docker-compose.remote.example.yml up -d
#
# To build from source instead of using a pre-built image, switch `image:` to
# `build: .` (uncomment the `build` line and comment out `image`).
# =============================================================================

services:
  eagle-viewer:
    image: eagle-viewer:v4.2.0
    # build: .
    container_name: eagle-viewer
    restart: always
    ports:
      - "8000:8000"
    environment:
      # Path to the vault inside the container. The volumes below map the
      # host mount point here.
      - EAGLE_VAULT_ROOT=/vault
      # Production: always set a password + a random secret key.
      #   openssl rand -hex 32
      - VIEWER_PASSWORD=change-me
      - VIEWER_SECRET_KEY=replace-with-openssl-rand-hex-32
      # State file path should be outside the read-only vault mount to
      # preserve state across library updates.
    volumes:
      # ===== Server-side vault mount (choose one, adapt to your setup) =====
      # 1) Host already mounts .library via SMB/WebDAV/NFS — bind it directly
      - /volume1/eagle/Design.library:/vault:ro
      # 2) Pre-built docker volume (e.g. NFS-backed)
      # - eagle-vault:/vault:ro
      # 3) Local development — relative path
      # - ./vault:/vault:ro
      - ./data:/data
    # For remote access, expose only to the VPN subnet or localhost — not
    # directly to 0.0.0.0 on the public internet.
    # When using Tailscale, switch container networking so the VPN address
    # is directly reachable.

  # ---------------------------------------------------------------------------
  # Optional: HTTPS reverse proxy (Tailscale / Caddy)
  # Enables navigator.share and clipboard copy (require HTTPS or localhost)
  # and encrypts external traffic. Without it, share/copy features are
  # disabled by the browser; browsing and preview still work.
  # ---------------------------------------------------------------------------
  # caddy:
  #   image: caddy:2
  #   restart: always
  #   ports:
  #     - "443:443"
  #     - "80:80"
  #   volumes:
  #     - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   depends_on:
  #     - eagle-viewer
  #
  # Corresponding Caddyfile (Caddyfile.example in the same directory):
  #   your-tailnet-name.ts.net {
  #     reverse_proxy eagle-viewer:8000
  #   }

# To use a docker volume for the vault, create it first. Example (NFS):
#   docker volume create --driver local \
#     --opt type=nfs --opt o=addr=192.168.1.10,rw,nolock,soft \
#     --opt device=:/volume1/eagle eagle-vault
# volumes:
#   eagle-vault:
#     external: true
#   caddy_data:
#   caddy_config:
