<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 - Eagle Vault Viewer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .box {
      background: #fff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 320px;
    }
    h1 { margin: 0 0 24px; font-size: 1.25rem; color: #222; }
    .error { color: #c00; font-size: 0.9rem; margin-bottom: 12px; }
    label { display: block; font-size: 0.9rem; color: #666; margin-bottom: 6px; }
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 1rem;
      margin-bottom: 16px;
    }
    input[type="password"]:focus { outline: none; border-color: #2563eb; }
    button {
      width: 100%;
      padding: 10px 16px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Eagle Vault Viewer</h1>
    <p style="color:#666;font-size:0.9rem;margin:0 0 20px;">请输入访问密码</p>
    __ERROR_HTML__
    <form method="post" action="/login">
      <label for="password">密码</label>
      <input type="password" id="password" name="password" autocomplete="current-password" autofocus required />
      <button type="submit">登录</button>
    </form>
  </div>
</body>
</html>
