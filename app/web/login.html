<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 - Eagle Vault Viewer</title>
  <style>
    :root {
      --bg:#f7f3ec;
      --bg2:#fffdfa;
      --border:rgba(53,43,32,.13);
      --text:#29241f;
      --text-muted:#70685f;
      --accent:#c96535;
      --accent-solid:#a8501f;
      --accent-solid-fg:#fffdfa;
      --error:#b3402e;
      --font-ui:"Avenir Next","SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
      --font-display:"Iowan Old Style","Songti SC","Noto Serif SC",Georgia,serif;
      color-scheme:light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#1a1816;
        --bg2:#26241f;
        --border:rgba(255,238,220,.1);
        --text:#f1ece5;
        --text-muted:#9a928a;
        --accent:#5a7aff;
        --accent-solid:#3f5bd9;
        --accent-solid-fg:#fff;
        --error:#f3a49a;
        color-scheme:dark;
      }
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      font-family:var(--font-ui);
      background:
        radial-gradient(110% 55% at 50% -12%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 66%),
        var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
    }
    .box {
      width:100%;
      max-width:340px;
      padding:32px 28px 28px;
      border:1px solid var(--border);
      border-radius:16px;
      background:var(--bg2);
      box-shadow:0 1px 2px rgba(58,42,25,.08), 0 8px 24px rgba(58,42,25,.08);
    }
    .brand {
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:22px;
    }
    .brand svg { display:block; }
    .brand .tile { fill:var(--accent); }
    .brand h1 {
      margin:0;
      font-family:var(--font-display);
      font-size:19px;
      font-weight:700;
      letter-spacing:-.02em;
    }
    .brand h1 b { color:var(--accent); font-weight:700; }
    .sub {
      margin:0 0 20px;
      font-size:13px;
      color:var(--text-muted);
    }
    .error {
      margin:0 0 12px;
      font-size:12px;
      color:var(--error);
    }
    label {
      display:block;
      margin-bottom:6px;
      font-size:12px;
      color:var(--text-muted);
    }
    input[type="password"] {
      width:100%;
      height:40px;
      padding:0 12px;
      border:1px solid var(--border);
      border-radius:10px;
      background:var(--bg);
      color:var(--text);
      font:inherit;
      font-size:14px;
      margin-bottom:16px;
    }
    input[type="password"]:focus {
      outline:2px solid var(--accent);
      outline-offset:1px;
    }
    button {
      width:100%;
      height:40px;
      border:none;
      border-radius:10px;
      background:var(--accent-solid);
      color:var(--accent-solid-fg);
      font:inherit;
      font-size:14px;
      font-weight:600;
      cursor:pointer;
    }
    button:hover { opacity:.92; }
    button:focus-visible {
      outline:2px solid var(--accent);
      outline-offset:2px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="brand">
      <svg viewBox="0 0 28 28" width="26" height="26" aria-hidden="true">
        <rect class="tile" x="1.5" y="1.5" width="25" height="25" rx="8"/>
        <path d="M8 18.6 13.4 10 16.6 14.4 19 11.4 20.5 18.6Z" fill="#fff" fill-opacity="0.95"/>
      </svg>
      <h1>Eagle <b>Vault</b></h1>
    </div>
    <p class="sub">输入访问密码以继续</p>
    __ERROR_HTML__
    <form method="post" action="/login">
      <label for="password">密码</label>
      <input type="password" id="password" name="password" autocomplete="current-password" autofocus required />
      <button type="submit">登录</button>
    </form>
  </div>
</body>
</html>
