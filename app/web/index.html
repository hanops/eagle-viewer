<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)" />
  <title>Eagle Vault Viewer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232c7be5'/%3E%3Cpath d='M17 20h30v7H25v9h18v7H25v1h23v7H17z' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="manifest" href="/manifest.json" />
</head>
<body>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="toolbar-left">
      <button type="button" class="menu-btn" id="menuBtn" aria-label="菜单"></button>
      <span class="toolbar-title">Eagle Vault Viewer</span>
      <span class="version-badge" id="appVersionBadge" aria-label="当前版本"></span>
    </div>
    <div class="toolbar-center">
      <div class="search-box">
        <span id="searchIcon"></span>
        <input type="search" id="searchInput" placeholder="搜索名称、标签、备注、格式…（#标签 / /文件夹）" autocomplete="off" />
      </div>
    </div>
    <div class="toolbar-right">
      <select class="tb-select" id="sortSelect">
        <option value="mtime">修改时间</option>
        <option value="btime">创建时间</option>
        <option value="name">名称</option>
        <option value="size">大小</option>
        <option value="ext">格式</option>
      </select>
      <select class="tb-select" id="sortDirSelect">
        <option value="desc">降序</option>
        <option value="asc">升序</option>
      </select>
      <select class="tb-select" id="typeSelect">
        <option value="all">全部</option>
        <option value="image">图片</option>
        <option value="video">视频</option>
        <option value="document">文档</option>
        <option value="audio">音频</option>
        <option value="other">其他</option>
      </select>
      <button type="button" class="tb-btn" id="viewGrid" title="网格视图"></button>
      <button type="button" class="tb-btn" id="viewList" title="列表视图"></button>
      <button type="button" class="tb-btn" id="reloadLibraryBtn" title="刷新资源库"></button>
      <button type="button" class="tb-btn" id="filterPanelBtn" title="高级筛选"></button>
      <button type="button" class="tb-btn" id="savedViewsBtn" title="保存视图"></button>
      <button type="button" class="tb-btn" id="statsBtn" title="索引状态"></button>
      <button type="button" class="tb-btn" id="duplicatesBtn" title="疑似重复"></button>
      <button type="button" class="tb-btn" id="commandBtn" title="命令面板"></button>
      <button type="button" class="tb-btn" id="exportListBtn" title="导出清单（左键CSV/右键JSON）"></button>
      <button type="button" class="tb-btn" id="themeToggle" title="切换主题"></button>
      <a href="/logout" class="tb-link">退出</a>
    </div>
  </div>

  <div class="utility-panel" id="advancedPanel">
    <div class="utility-panel-head">
      <strong>高级筛选</strong>
      <button type="button" data-close-panel="advancedPanel">关闭</button>
    </div>
    <div class="filter-grid">
      <label>最小宽度 <input type="number" id="filterMinWidth" min="0" placeholder="px" /></label>
      <label>最小高度 <input type="number" id="filterMinHeight" min="0" placeholder="px" /></label>
      <label>最小大小 <input type="number" id="filterMinSize" min="0" placeholder="MB" /></label>
      <label>最大大小 <input type="number" id="filterMaxSize" min="0" placeholder="MB" /></label>
      <label>形状
        <select id="filterShape">
          <option value="">不限</option>
          <option value="landscape">横图</option>
          <option value="portrait">竖图</option>
          <option value="square">方图</option>
        </select>
      </label>
      <label>标签
        <select id="filterTagState">
          <option value="">不限</option>
          <option value="tagged">有标签</option>
          <option value="untagged">无标签</option>
        </select>
      </label>
      <label>备注
        <select id="filterAnnotationState">
          <option value="">不限</option>
          <option value="annotated">有备注</option>
          <option value="unannotated">无备注</option>
        </select>
      </label>
      <label>来源
        <select id="filterSourceState">
          <option value="">不限</option>
          <option value="sourced">有来源</option>
          <option value="unsourced">无来源</option>
        </select>
      </label>
    </div>
    <div class="panel-actions">
      <button type="button" id="applyFiltersBtn" class="primary">应用筛选</button>
      <button type="button" id="clearFiltersBtn">清空筛选</button>
    </div>
  </div>

  <div class="utility-panel" id="savedViewsPanel">
    <div class="utility-panel-head">
      <strong>保存视图</strong>
      <button type="button" data-close-panel="savedViewsPanel">关闭</button>
    </div>
    <div class="save-view-row">
      <input type="text" id="savedViewName" placeholder="视图名称" />
      <button type="button" id="saveCurrentViewBtn" class="primary">保存当前</button>
    </div>
    <div class="saved-view-list" id="savedViewList"></div>
  </div>

  <div class="utility-panel" id="statsPanel">
    <div class="utility-panel-head">
      <strong>索引状态</strong>
      <button type="button" data-close-panel="statsPanel">关闭</button>
    </div>
    <div class="stats-grid" id="statsGrid">加载中…</div>
  </div>

  <div class="command-overlay" id="commandOverlay">
    <div class="command-box">
      <input type="text" id="commandInput" placeholder="输入命令、文件夹、标签或视图" />
      <div class="command-list" id="commandList"></div>
    </div>
  </div>

  <!-- Batch action bar -->
  <div class="batch-bar" id="batchBar">
    <span class="batch-count" id="selectedCount">已选 0 个</span>
    <span class="batch-meta" id="selectedMeta">总大小 0 B</span>
    <span class="batch-breakdown" id="selectedBreakdown">类型分布 -</span>
    <button type="button" id="selectAllBtn">全选</button>
    <button type="button" id="invertSelectBtn">反选</button>
    <button type="button" id="clearSelectBtn">取消</button>
    <button type="button" id="exportSelectedBtn" title="导出已选项（左键CSV/右键JSON）">导出已选</button>
    <button type="button" id="batchDownloadBtn" class="primary">打包下载</button>
  </div>

  <!-- Layout -->
  <div class="layout">
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <div class="sidebar-wrap" id="sidebarWrap">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-section">
          <div class="sidebar-section-title">浏览</div>
          <div class="sidebar-item" id="allItems">
            <span class="sidebar-item-icon" id="iconAllItems"></span>
            <span class="sidebar-item-name">全部文件</span>
          </div>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-section-title">最近添加</div>
          <div class="sidebar-item" id="recent7" data-days="7">
            <span class="sidebar-item-icon" id="iconRecent7"></span>
            <span class="sidebar-item-name">最近 7 天</span>
          </div>
          <div class="sidebar-item" id="recent30" data-days="30">
            <span class="sidebar-item-icon" id="iconRecent30"></span>
            <span class="sidebar-item-name">最近 30 天</span>
          </div>
        </div>
        <div class="sidebar-section" id="folderSection">
          <div class="sidebar-section-title">文件夹</div>
          <div id="folderTree"></div>
        </div>
        <div class="sidebar-section" id="tagSection" style="display:none;">
          <div class="sidebar-section-title">标签</div>
          <input type="search" id="tagSearchInput" class="tag-search" placeholder="搜索标签…" autocomplete="off" />
          <div class="tag-list" id="tagList"></div>
        </div>
      </aside>
      <div class="sidebar-resizer" id="sidebarResizer"></div>
    </div>

    <div class="sidebar-toggle" id="sidebarToggle"></div>

    <main class="main" id="mainArea">
      <div id="contentToolbar" class="content-toolbar" style="display:none;">
        <label>排序</label>
        <select id="ctSortSelect">
          <option value="mtime">修改时间</option>
          <option value="btime">创建时间</option>
          <option value="name">名称</option>
          <option value="size">大小</option>
          <option value="ext">格式</option>
        </select>
        <select id="ctSortDirSelect">
          <option value="desc">降序</option>
          <option value="asc">升序</option>
        </select>
        <label>类型</label>
        <select id="ctTypeSelect">
          <option value="all">全部</option>
          <option value="image">图片</option>
          <option value="video">视频</option>
          <option value="document">文档</option>
          <option value="audio">音频</option>
          <option value="other">其他</option>
        </select>
        <div class="quick-filters" id="quickFilters">
          <button type="button" class="quick-filter" data-type="all">全部</button>
          <button type="button" class="quick-filter" data-type="image">图片</button>
          <button type="button" class="quick-filter" data-type="document">文档</button>
          <button type="button" class="quick-filter" data-type="video">视频</button>
        </div>
        <span class="content-title" id="contentTitle"></span>
      </div>
      <div class="content-body" id="contentBody">
        <div class="empty-state" id="emptyState">
          <span id="emptyIcon"></span>
          <span>选择左侧文件夹查看素材</span>
        </div>
      </div>
    </main>

    <div class="inspector" id="inspector">
      <div class="inspector-header">
        <div class="inspector-header-left">
          <div class="inspector-nav">
            <button type="button" class="inspector-nav-btn" id="inspectorPrev" aria-label="上一项"></button>
            <button type="button" class="inspector-nav-btn" id="inspectorNext" aria-label="下一项"></button>
          </div>
          <span class="inspector-header-title">详情</span>
        </div>
        <button type="button" class="inspector-close" id="inspectorClose"></button>
      </div>
      <div class="inspector-inner" id="inspectorInner"></div>
      <div class="inspector-actions" id="inspectorActions"></div>
    </div>
  </div>

  <script src="/static/core.js"></script>
  <script src="/static/render.js"></script>
  <script src="/static/api.js"></script>
  <script src="/static/interactions.js"></script>
  <script src="/static/bootstrap.js"></script>
</body>
</html>
