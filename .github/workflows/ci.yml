name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Version consistency
        run: uv run python scripts/check_versions.py

      - name: Lint
        run: uv run ruff check app tests scripts

      - name: Test
        run: uv run pytest

      - name: Python compile check
        run: uv run python -m compileall app

      # Keep deploy artifact checks symmetric with `make check`.
      - name: Deploy artifact check
        run: uv run python scripts/verify_deploy.py

  frontend-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Tests require Node >= 21 (node --test glob, navigator.language); pin it.
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JS syntax check
        run: |
          for file in app/web/*.js; do
            node --check "$file"
          done

      - name: JS behavior tests
        run: node --test "tests/js/*.test.js"

  deploy-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify deploy artifacts (digest pin, healthcheck)
        run: python scripts/verify_deploy.py

      - name: Verify image builds
        run: docker build --tag eagle-viewer:ci-build .

  checklist-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gate UI changes on regression checklist reference
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python scripts/check_regression_gate.py
